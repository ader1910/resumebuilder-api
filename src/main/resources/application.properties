# Mongodb configuration
spring.data.mongodb.uri=${MONGODB_URI}

# Email configuration
spring.mail.host=smtp.resend.com
spring.mail.port=587
# Username Resend SELALU tulisan "resend"
spring.mail.username=resend
# API Key Resend
spring.mail.password=${RESEND_API_KEY}

# Konfigurasi Tambahan
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email pengirim
spring.mail.properties.mail.smtp.from=${MAIL_FROM:onboarding@resend.dev}

# Application info
app.base.url=${APP_BASE_URL:http://localhost:8080}

# Cloudinary information
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JWT Configuration
jwt.secret=${JWT_SECRET}
# Expiration 24 Jam
jwt.expiration=86400000

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

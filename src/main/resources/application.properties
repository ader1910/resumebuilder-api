# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# Cukup panggil variabelnya. IntelliJ akan mengisinya otomatis.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# ==========================================
# EMAIL CONFIGURATION (RESEND)
# ==========================================
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
# Password diambil dari Environment Variable
spring.mail.password=${RESEND_API_KEY}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.from=onboarding@resend.dev

# ==========================================
# APPLICATION INFO
# ==========================================
app.base.url=${APP_BASE_URL:http://localhost:8080}

# ==========================================
# CLOUDINARY CONFIGURATION
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==========================================
# SECURITY & JWT CONFIGURATION
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ==========================================
# PAYMENT GATEWAY (RAZORPAY)
# ==========================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ==========================================
# FILE UPLOAD LIMITS
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB